# QA descriptor for the Polycall binding matrix (read by polycall/qa/run_qa.py).
# This repository is NOT a Python package and is not pip-installable;
# its native manifest is src/FSharpPolycall/FSharpPolycall.fsproj.
[tool.polycall.binding]
name = "fsharp-polycall"
language = "F#"
native_manifest = "src/FSharpPolycall/FSharpPolycall.fsproj"
registry = "npm"
package = "@obinexusltd/fsharp-polycall"
abi = 1
support = "supported"
linux_image = "mcr.microsoft.com/dotnet/sdk:8.0"
build = "dotnet build src/FSharpPolycall.Cli/FSharpPolycall.Cli.fsproj -c Release"
test = "sh /qa/build-linux-core.sh && apt-get install -y -qq unzip && POLYCALL_LIBRARY=/opt/polycall/lib/libpolycall.so.1 POLYCALL_CLI=/opt/polycall/bin/polycall sh scripts/test.sh && POLYCALL_LIBRARY=/opt/polycall/lib/libpolycall.so.1 sh scripts/test-package.sh"
windows_test = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows.ps1 -Core <prefix> [-BuildDir <portable dotnet publish output when no .NET SDK>] [-Gcc <mingw gcc>]  (run once with windows-msvc-x64, once with windows-ucrt64-x64)"
